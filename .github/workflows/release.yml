name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read

jobs:
    # ----------------------------------------------------------------
    # Job 1 — Build + test avant toute release (pas de tag cassé)
    # ----------------------------------------------------------------
    build-and-test:
        name: Build + test — Node 24
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node 24
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: TypeScript strict check
              run: npx tsc --noEmit

            - name: Lint check
              run: npm run lint:check

            - name: Run tests
              run: NODE_ENV=test npm test

            - name: Build (production)
              run: npm run build

    # ----------------------------------------------------------------
    # Job 2 — Release GitHub avec notes tirées du CHANGELOG (pas de publish npm,
    # le projet n'est pas une lib — cf. étape 02)
    # ----------------------------------------------------------------
    release:
        name: Create GitHub release
        needs: build-and-test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Extract CHANGELOG section for this tag
              id: changelog
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  awk -v ver="$version" '
                      $0 ~ "^## \\[" ver "\\]" { found=1; next }
                      found && $0 ~ "^## \\[" { exit }
                      found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md
                  echo "notes_found=$([ -s /tmp/release-notes.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ "${{ steps.changelog.outputs.notes_found }}" = "true" ]; then
                      gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
                  else
                      gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
                  fi
